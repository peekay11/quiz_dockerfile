<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Quiz Showdown</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
<div class="container">
    
    <div id="debug-console" style="display:none; margin: 10px; padding: 15px; background: #fee2e2; border: 2px solid #ef4444; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 12px; color: #991b1b; position: relative; z-index: 9999;">
        <h3 style="margin-top:0; color: #b91c1c;">⚠️ Connection/System Error</h3>
        <div id="error-message-list" style="max-height: 100px; overflow-y: auto;"></div>
        <button onclick="location.reload()" style="margin-top:10px; background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Retry Connection</button>
    </div>

    <div id="start-menu" class="card">
        <h1>🎮 Team Quiz Showdown</h1>
        <div id="lobby-ui">
            <input type="text" id="player-name" placeholder="Enter Your Name" class="input-field" style="width: 100%; margin-bottom: 10px; padding: 12px;">
            <div style="margin-top:15px; text-align: center;">
                <button class="btn btn-primary" style="width: 100%;" onclick="window.dispatchEvent(new CustomEvent('hostGame'))">Host New Game</button>
                
                <div style="margin-top:30px; border-top: 1px solid #ddd; padding-top: 20px;">
                    <p style="font-size: 0.8rem; color: #666; margin-bottom: 10px;">Joining a friend?</p>
                    <div style="display: flex; gap: 5px; justify-content: center;">
                        <input type="text" id="join-code" placeholder="CODE" class="input-field" style="width:100px; text-transform:uppercase; text-align: center;">
                        <button class="btn btn-outline" id="btn-join">Join Room</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="waiting-room" style="display:none; text-align: center;">
            <div style="background: #f3f4f6; padding: 15px; border-radius: 8px; display: inline-block;">
                <span style="font-size: 0.8rem; text-transform: uppercase; color: #666;">Room Code</span>
                <div id="display-code" style="font-size: 32px; font-weight: bold; color: #3b82f6; letter-spacing: 4px;">----</div>
            </div>
            <p id="player-status" style="margin: 20px 0; font-style: italic;">Connecting to Supabase...</p>
            
            <div id="host-only-controls" style="display:none; border-top: 1px solid #eee; padding-top: 20px;">
                <button class="btn btn-check" id="btn-start" style="width:100%; padding: 15px;">START GAME (Team Shuffle)</button>
            </div>
        </div>
    </div>

    <div id="game-screen" style="display:none;">
        <div class="game-layout" style="display: flex; gap: 20px;">
            
            <div class="main-column" style="flex: 3; position: relative;">
                <div class="game-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div class="timer-circle" style="background: #333; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold;">
                        <span id="timer-sec">10</span>s
                    </div>
                    <div class="turn-info" style="text-align: right;">
                        <p style="margin:0; font-size: 0.8rem; color: #666;">Current Turn</p>
                        <h2 id="active-player-display" style="margin:0; color: #1f2937;">Waiting...</h2>
                    </div>
                </div>
                
                <div class="card quiz-box" style="position: relative;">
                    <div id="q-text" class="question-text" style="font-size: 22px; margin-bottom: 20px; font-weight: 600;">Question loading...</div>
                    <div id="options-list" class="options-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
                    
                    <div id="input-lock" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.7); z-index:100; border-radius: 12px; cursor: not-allowed; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #666;">
                        Watching...
                    </div>
                </div>
            </div>

            <div class="sidebar" style="flex: 1;">
                <div class="team-card" style="background: #eff6ff; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #bfdbfe;">
                    <h3 style="margin:0; display:flex; justify-content: space-between;">Team A <span id="score-t1">0</span></h3>
                    <ul id="list-t1" style="list-style: none; padding: 0; font-size: 0.9rem; margin-top: 10px;"></ul>
                </div>

                <div class="team-card" style="background: #fef2f2; padding: 15px; border-radius: 12px; border: 1px solid #fecaca;">
                    <h3 style="margin:0; display:flex; justify-content: space-between;">Team B <span id="score-t2">0</span></h3>
                    <ul id="list-t2" style="list-style: none; padding: 0; font-size: 0.9rem; margin-top: 10px;"></ul>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="py" src="database.py" config="pyscript.json"></script>
<script>
    // System Error Logger
    function showDebugError(msg) {
        document.getElementById('debug-console').style.display = 'block';
        const list = document.getElementById('error-message-list');
        const entry = document.createElement('div');
        entry.innerText = ">> " + msg;
        list.appendChild(entry);
    }

    // Global JS Error Catching
    window.onerror = (m, s, l) => showDebugError(`JS: ${m} (Line ${l})`);
    window.onunhandledrejection = (e) => showDebugError(`DB: ${e.reason}`);

    function showWaiting(code, isHost) {
        document.getElementById('lobby-ui').style.display = 'none';
        document.getElementById('waiting-room').style.display = 'block';
        document.getElementById('display-code').innerText = code;
        document.getElementById('player-status').innerText = "In Lobby - Waiting for players...";
        if(isHost) document.getElementById('host-only-controls').style.display = 'block';
    }
</script>

</body>
</html>
